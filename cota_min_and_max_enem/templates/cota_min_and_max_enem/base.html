{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Cota ENEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'cota_min_and_max_enem/css/base.css' %}">
   

    
</head>
<body>

    <nav class="navbar">
        <div class="brand">Minha Cota ENEM</div>
        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'buscar_cursos' %}">Buscar Cursos</a>
                <a href="{% url 'perfil' %}">Meu Perfil</a>
                <a href="{% url 'logout' %}" style="color: #ef4444;">Sair</a>
            {% else %}
                <a href="{% url 'login' %}">Entrar</a>
                <a href="{% url 'registro' %}">Cadastrar</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="message {{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </div>

</body>
</html>
